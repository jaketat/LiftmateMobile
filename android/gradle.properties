# Máy chỉ có 8GB RAM. Cấp -Xmx8G khiến Gradle daemon + Kotlin daemon tranh chỗ với
# Android Studio và emulator -> máy cạn RAM -> Dart compiler bị kill giữa chừng
# (PathNotFoundException: app.dill.incremental.dill). Giới hạn lại cho vừa đủ.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.daemon=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Project ở ổ D, thư viện pub ở ổ C: Kotlin biên dịch tăng dần bị lỗi "Could not close incremental caches" trên Windows
kotlin.incremental=false
